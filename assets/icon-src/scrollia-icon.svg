<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#2D5A3D"/>

  <!-- Cuerpo de la S -->
  <path d="M 67 29
           C 61 20, 42 20, 37 31
           C 32 43, 48 49, 54 54
           C 60 59, 76 65, 71 77
           C 66 88, 47 88, 41 79"
        fill="none" stroke="#EAD9B8" stroke-width="12" stroke-linecap="round"/>

  <!-- Rollos: círculo pergamino + espiral dorada hacia dentro -->
  <g>
    <circle cx="70" cy="25" r="10" fill="#EAD9B8"/>
    <circle cx="38" cy="83" r="10" fill="#EAD9B8"/>
    <g fill="none" stroke="#B08D3E" stroke-width="2.6" stroke-linecap="round">
      <!-- espiral superior -->
      <path d="M 70 17.5
               A 7.5 7.5 0 1 0 77.5 25
               A 4.5 4.5 0 1 1 70 29.5
               A 2 2 0 1 0 72 25"/>
      <!-- espiral inferior (rotada 180°) -->
      <path d="M 38 90.5
               A 7.5 7.5 0 1 0 30.5 83
               A 4.5 4.5 0 1 1 38 78.5
               A 2 2 0 1 0 36 83"/>
    </g>
  </g>
</svg>
